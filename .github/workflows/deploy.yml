name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:            # von Hand starten (z. B. nach dem Umstellen von Pages auf «GitHub Actions»)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx vitest run        # Tests müssen grün sein (Referenzvergleich ohne Referenz-Datei übersprungen)
      - run: npm run build         # Typprüfung (tsc) und Build mit Basis / (eigene Domain fgscheck.ch)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
